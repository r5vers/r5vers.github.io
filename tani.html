<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>RV · Teşhis</title>
  <style>
    body { margin: 0; padding: 16px; background: #0b0c10; color: #e8eaf2; font: 14px/1.45 -apple-system, system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 4px 0 4px; }
    p.lead { color: #9aa0b4; margin: 0 0 14px; font-size: 13px; }
    .row { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; padding: 9px 12px; margin: 6px 0; border-radius: 12px; background: #15171d; }
    .row b { font-weight: 600; }
    .row small { grid-column: 2; color: #9aa0b4; font-size: 12px; word-break: break-word; white-space: pre-wrap; }
    .ok::before { content: '✓'; color: #30d158; } .bad::before { content: '✗'; color: #ff6b6b; } .run::before { content: '…'; color: #9aa0b4; }
    .ok, .bad, .run { display: contents; }
    button { margin: 12px 8px 0 0; padding: 11px 15px; border: 0; border-radius: 11px; background: #9fa8ff; color: #0b0c10; font: 600 14px -apple-system, system-ui, sans-serif; }
    button.ghost { background: #22252e; color: #e8eaf2; }
  </style>
</head>
<body>
  <h1>RV · Teşhis</h1>
  <p class="lead">Bu sayfa sitenin bu cihazda neden çalışmadığını bulur. Bitince ekranın görüntüsünü al (ya da “Kopyala” deyip yapıştır) ve gönder.</p>
  <div id="out"></div>
  <button id="copy">Kopyala</button><button class="ghost" id="repair">Önbelleği temizle ve yenile</button><button class="ghost" onclick="location.href='/profiles.html'">Siteye dön</button>
  <script type="module">
    const out = document.getElementById('out');
    const lines = [];
    function row(title) {
      const el = document.createElement('div');
      el.className = 'row';
      el.innerHTML = '<span class="run"></span><b></b><small></small>';
      el.querySelector('b').textContent = title;
      out.append(el);
      const set = (ok, text) => {
        el.firstChild.className = ok ? 'ok' : 'bad';
        el.querySelector('small').textContent = text || '';
        lines.push(`${ok ? 'OK ' : 'XX '}${title}${text ? `: ${text}` : ''}`);
      };
      return set;
    }
    async function check(title, fn) {
      const set = row(title);
      const t0 = performance.now();
      try { const r = await Promise.race([fn(), new Promise((_, no) => setTimeout(() => no(new Error('30 sn içinde bitmedi')), 30000))]); set(true, `${r ?? ''} (${Math.round(performance.now() - t0)} ms)`.trim()); return true; }
      catch (e) { set(false, `${e?.name || ''} ${e?.message || e}`.trim()); return false; }
    }
    const mb = (b) => `${(b / 1e6).toFixed(1)} MB`;

    await check('Tarayıcı', async () => navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''));
    const BUILD = '785e1bb8c1';
    await check('Sürüm', async () => BUILD);
    await check('Gerekli özellikler', async () => {
      const miss = [['IndexedDB', 'indexedDB' in window], ['structuredClone', 'structuredClone' in window], ['Array.at', !![].at], ['crypto.subtle', !!crypto?.subtle], ['DecompressionStream', 'DecompressionStream' in window]].filter(([, ok]) => !ok).map(([n]) => n);
      if (miss.filter((n) => n !== 'DecompressionStream').length) throw new Error(`eksik: ${miss.join(', ')} (iOS güncellemesi gerekli)`);
      return miss.length ? `eksik ama sorun değil: ${miss.join(', ')}` : 'hepsi var';
    });
    await check('Depolama', async () => {
      const e = await navigator.storage?.estimate?.() || {};
      const p = await navigator.storage?.persisted?.().catch(() => false);
      return `kullanılan ${mb(e.usage || 0)} / izin ${mb(e.quota || 0)}${p ? ' · kalıcı' : ''}`;
    });
    await check('Cihaz veritabanı (IndexedDB)', () => new Promise((ok, no) => {
      const r = indexedDB.open('rv-check', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('s');
      r.onerror = () => no(r.error);
      r.onsuccess = () => {
        const db = r.result, t = db.transaction('s', 'readwrite');
        t.objectStore('s').put(new ArrayBuffer(1 << 20), 'x');
        t.oncomplete = () => { db.close(); ok('1 MB yazıldı'); };
        t.onabort = t.onerror = () => no(t.error);
      };
    }));
    const xhr = (url) => new Promise((ok, no) => { const x = new XMLHttpRequest(); x.open('GET', url); x.responseType = 'arraybuffer'; x.onload = () => (x.status === 200 ? ok(x.response) : no(new Error(`HTTP ${x.status}`))); x.onerror = () => no(new Error('bağlantı hatası')); x.send(); });
    let manifest = null;
    await check('Veri listesi (GitHub)', async () => { manifest = JSON.parse(new TextDecoder().decode(await xhr('/data/manifest.json?t=' + Date.now()))); return `${Object.keys(manifest.packs).length} paket`; });
    await check('EURUSD bir yıl (GitHub)', async () => {
      const f = manifest.packs.EURUSD.tfs['1m'].files.at(-1);
      const b = await xhr('/data/' + f.path);
      return `${f.tag}: ${mb(b.byteLength)} indi`;
    });
    let api = null;
    const okApi = await check('Sitenin kodu', async () => { api = (await import('./js/api.js?v=785e1bb8c1')).api; return 'yüklendi'; });
    if (okApi) {
      let list = [];
      await check('Veri setleri', async () => {
        list = await api.datasets();
        return list.map((d) => `${d.symbol} ${d.base_tf}${d.stream ? ' (GitHub)' : ''}${d.meta?.partial ? ' (yarım)' : ''} · ${d.bar_count} bar`).join('\n') || 'yok';
      });
      for (const d of list.filter((x) => x.meta?.pack).slice(0, 8)) {
        await check(`Grafik verisi: ${d.symbol} ${d.base_tf}${d.stream ? ' (GitHub)' : ''}`, async () => {
          const r = await api.bars(d.id, { tf: '15m', limit: 300 });
          return `${r.count} bar`;
        });
      }
    }
    await check('Son hatalar', async () => {
      const errs = JSON.parse(localStorage.getItem('rv-errors') || '[]').slice(-8).reverse();
      return errs.length ? errs.map((e) => `${e.at.slice(5, 16).replace('T', ' ')} ${e.page} ${e.where}: ${e.msg}`).join('\n') : 'yok';
    });
    document.getElementById('copy').onclick = async () => {
      try { await navigator.clipboard.writeText(lines.join('\n')); document.getElementById('copy').textContent = 'Kopyalandı'; } catch { alert(lines.join('\n')); }
    };
    document.getElementById('repair').onclick = async () => {
      try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch {}
      try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
      location.replace('/tani.html?r=' + Date.now());
    };
  </script>
</body>
</html>
