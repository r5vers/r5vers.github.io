<body class="page-gate">
  <script>
    // the background picked on the profile screen of this device
    try {
      const g = JSON.parse(localStorage.getItem('rt-gate-look') || 'null');
      if (g && g.css) {
        const s = document.body.style;
        s.setProperty('--page-bg', g.css); s.setProperty('--accent', g.accent); s.setProperty('--up', g.up);
        if (g.light) document.documentElement.dataset.theme = 'light';
      }
    } catch (e) { /* nothing saved */ }
  </script>

      <h1><span class="rv">RV</span><small class="rv-sub">replay terminal</small></h1>
      <p>Site şifresiyle gir (Railway'de <code>TERMINAL_PASSWORD</code>). Ardından profilini seçersin.</p>
      <input class="ctl" id="pw" type="password" autocomplete="current-password" placeholder="Şifre" required autofocus>
      <button class="btn primary" type="submit">Giriş yap</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </main>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
        if (r.ok) { location.replace('/profiles.html'); return; }
        const d = await r.json().catch(() => ({}));
        err.textContent = d.detail || 'Giriş başarısız';
      } catch { err.textContent = 'Sunucuya ulaşılamadı'; }
    });
  </script>
