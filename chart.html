    <script>
  // If the site's scripts cannot start (an old copy of a file, a failed
  // download), say so and offer to start clean instead of a dead page.
  (function () {
    var shown = false;
    function show(msg) {
      if (shown) return; shown = true;
      var d = document.createElement('div');
      d.setAttribute('style', 'position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;padding:14px 16px;border-radius:16px;background:#16171d;color:#eef0f4;font:14px/1.45 -apple-system,system-ui,sans-serif;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 20px 50px rgba(0,0,0,.6)');
      d.innerHTML = '<b style="display:block;margin-bottom:4px">Site açılamadı</b><span style="display:block;color:#9aa0b4;font-size:12px;word-break:break-word"></span><button style="margin-top:10px;padding:10px 14px;border:0;border-radius:10px;background:#9fa8ff;color:#0b0c10;font:600 14px -apple-system,system-ui,sans-serif">Onar ve yenile</button>';
      d.querySelector('span').textContent = String(msg || '').slice(0, 300);
      d.querySelector('button').onclick = function () {
        var jobs = [];
        try { jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
        try { jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
        Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
      };
      (document.body || document.documentElement).appendChild(d);
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) show('Dosya yüklenemedi: ' + (t.src || t.href));
      else if (/SyntaxError|import|module|export/i.test(String(e.message))) show(e.message);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var m = String((e.reason && (e.reason.message || e.reason)) || '');
      if (/SyntaxError|Importing|module|dynamically imported/i.test(m)) show(m);
    });
    setTimeout(function () { if (!window.__rvBooted) show('Sayfanın kodu 15 saniyede başlamadı.'); }, 15000);
  })();
  </script>

<body class="page-chart">
<div id="app" class="mode-browse">
  <header class="topbar glass">
    <a class="home-link" href="/home.html" title="Ana ekrana dön" aria-label="Ana ekrana dön"><span class="hl-ic" data-icon="home"></span><span class="hl-t">Home</span></a>
    <button class="instrument" id="instrument-btn" type="button" title="Enstrüman ve veri seti" aria-haspopup="true">
      <span class="dot"></span>
      <span><span class="sym" id="instrument-sym">—</span><span class="sub" id="instrument-sub">veri seti seçin</span></span>
      <span class="chev" data-icon="chevron"></span>
    </button>
    <div class="tf-group" id="tf-group" role="group" aria-label="Zaman dilimi"></div>
    <select id="tf-select" class="ctl sm mobile-only" title="Zaman dilimi" aria-label="Zaman dilimi"></select>
    <div class="mode-switch" id="mode-switch" role="tablist" aria-label="Mod"></div>
    <div class="spacer"></div>
    <button class="btn search-btn" id="btn-search" type="button" title="Sembol, zaman dilimi ya da komut ara" aria-label="Ara"><span data-icon="search"></span><span class="lbl">Ara</span><kbd>Ctrl K</kbd></button>
    <button class="btn" id="btn-indicators" type="button" title="İndikatör ekle"><span data-icon="indicator"></span><span class="lbl">İndikatör</span></button>
    <button class="btn icon" id="btn-sessions" type="button" title="Kayıtlı replay oturumları"><span data-icon="sessions"></span></button>
    <button class="btn icon mobile-only" id="btn-draw" type="button" title="Çizim araçları"><span data-icon="draw"></span></button>
    <button class="btn icon" id="btn-panel" type="button" title="İşlem paneli"><span data-icon="panel"></span></button>
    <button class="btn icon" id="btn-fullscreen" type="button" title="Tam ekran (Shift+F)"><span data-icon="expand"></span></button>
    <button class="btn icon" id="btn-settings" type="button" title="Ayarlar ve görünüm"><span data-icon="sliders"></span></button>
    <button class="profile-chip" id="btn-profile" type="button" title="Profil" aria-haspopup="true"></button>
  </header>

  <main class="workspace">
    <nav class="toolbar glass" id="draw-toolbar" aria-label="Çizim araçları"></nav>
    <section class="chart-area glass" id="chart-area">
      <div id="chart" class="chart"></div>
      <div id="legend" class="legend"></div>
      <div id="chart-msg" class="chart-msg hidden"></div>
      <div id="drawing-props" class="floating hidden"></div>
      <div class="replay-dock glass-pop" id="replay-controls"></div>
    </section>
    <aside class="sidepanel glass" id="sidepanel"></aside>
  </main>

  <section class="bottom glass" id="bottom">
    <div class="resizer" id="bottom-resizer"></div>
    <div class="tabs" id="tabs"></div>
    <div class="tab-body" id="tab-body"></div>
  </section>
</div>

<div id="toasts" aria-live="polite"></div>
